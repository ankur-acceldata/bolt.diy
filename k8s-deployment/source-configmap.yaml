  http-server.js: "#!/usr/bin/env node\nimport express from 'express';\nimport cors
    from 'cors';\nimport { spawn } from 'child_process';\nimport { fileURLToPath }
    from 'url';\nimport { dirname, join } from 'path';\nconst __filename = fileURLToPath(import.meta.url);\nconst
    __dirname = dirname(__filename);\nconst app = express();\napp.use(cors());\napp.use(express.json());\n//
    Health check endpoint\napp.get('/health', (req, res) => {\n    res.json({ status:
    'healthy', service: 'xdp-mcp-http-bridge' });\n});\n// List available tools\napp.get('/tools',
    async (req, res) => {\n    try {\n        const result = await executeMCPRequest({\n
    \           jsonrpc: '2.0',\n            id: Date.now(),\n            method:
    'tools/list',\n            params: {}\n        });\n        res.json(result);\n
    \   }\n    catch (error) {\n        res.status(500).json({ error: error.message
    });\n    }\n});\n// Execute MCP tool\napp.post('/tools/execute', async (req, res)
    => {\n    try {\n        const { toolName, arguments: toolArgs } = req.body;\n
    \       if (!toolName) {\n            return res.status(400).json({ error: 'toolName
    is required' });\n        }\n        const result = await executeMCPRequest({\n
    \           jsonrpc: '2.0',\n            id: Date.now(),\n            method:
    'tools/call',\n            params: {\n                name: toolName,\n                arguments:
    toolArgs || {}\n            }\n        });\n        res.json(result);\n    }\n
    \   catch (error) {\n        res.status(500).json({ error: error.message });\n
    \   }\n});\n// List datastores endpoint (direct)\napp.get('/datastores', async
    (req, res) => {\n    try {\n        const { page = 0, size = 10, sortBy = 'updatedAt:desc'
    } = req.query;\n        const result = await executeMCPRequest({\n            jsonrpc:
    '2.0',\n            id: Date.now(),\n            method: 'tools/call',\n            params:
    {\n                name: 'list-datastores',\n                arguments: {\n                    page:
    Number(page),\n                    size: Number(size),\n                    sort_by:
    sortBy\n                }\n            }\n        });\n        res.json(result);\n
    \   }\n    catch (error) {\n        res.status(500).json({ error: error.message
    });\n    }\n});\n// Execute Trino query\napp.post('/trino/execute', async (req,
    res) => {\n    try {\n        const { datastore_id, query, limit = 100 } = req.body;\n
    \       if (!datastore_id || !query) {\n            return res.status(400).json({
    error: 'datastore_id and query are required' });\n        }\n        const result
    = await executeMCPRequest({\n            jsonrpc: '2.0',\n            id: Date.now(),\n
    \           method: 'tools/call',\n            params: {\n                name:
    'trino-execute',\n                arguments: {\n                    datastore_id,\n
    \                   query,\n                    limit\n                }\n            }\n
    \       });\n        res.json(result);\n    }\n    catch (error) {\n        res.status(500).json({
    error: error.message });\n    }\n});\n// Function to execute MCP request\nfunction
    executeMCPRequest(request) {\n    return new Promise((resolve, reject) => {\n
    \       const mcpPath = join(__dirname, 'index.js');\n        const mcpProcess
    = spawn('node', [mcpPath], {\n            stdio: ['pipe', 'pipe', 'pipe'],\n            env:
    {\n                ...process.env,\n                NODE_ENV: process.env.NODE_ENV
    || 'production'\n            }\n        });\n        let stdout = '';\n        let
    stderr = '';\n        let responseReceived = false;\n        mcpProcess.stdout.on('data',
    (data) => {\n            const output = data.toString();\n            stdout +=
    output;\n            // Try to parse JSON-RPC response\n            const lines
    = stdout.split('\\n');\n            for (const line of lines) {\n                if
    (line.trim() && line.includes('\"jsonrpc\"')) {\n                    try {\n                        const
    response = JSON.parse(line);\n                        if (response.id === request.id)
    {\n                            responseReceived = true;\n                            resolve(response.result
    || response);\n                        }\n                    }\n                    catch
    (e) {\n                        // Not a complete JSON yet, continue\n                    }\n
    \               }\n            }\n        });\n        mcpProcess.stderr.on('data',
    (data) => {\n            stderr += data.toString();\n            console.error('MCP
    stderr:', data.toString());\n        });\n        mcpProcess.on('close', (code)
    => {\n            if (!responseReceived) {\n                if (code !== 0) {\n
    \                   reject(new Error(`MCP process exited with code ${code}: ${stderr}`));\n
    \               }\n                else {\n                    // Try to extract
    result from stdout\n                    try {\n                        const lines
    = stdout.split('\\n');\n                        for (const line of lines) {\n
    \                           if (line.trim() && line.includes('\"result\"')) {\n
    \                               const response = JSON.parse(line);\n                                resolve(response.result
    || response);\n                                return;\n                            }\n
    \                       }\n                        resolve({ stdout, stderr });\n
    \                   }\n                    catch (e) {\n                        reject(new
    Error(`Failed to parse MCP response: ${stdout}`));\n                    }\n                }\n
    \           }\n        });\n        mcpProcess.on('error', (error) => {\n            reject(error);\n
    \       });\n        // Send the request\n        mcpProcess.stdin.write(JSON.stringify(request)
    + '\\n');\n        mcpProcess.stdin.end();\n    });\n}\nconst PORT = process.env.HTTP_PORT
    || 3000;\nconst HOST = '0.0.0.0';\napp.listen(PORT, HOST, () => {\n    console.log(`\U0001F680
    XDP MCP HTTP Bridge running on http://${HOST}:${PORT}`);\n    console.log('\U0001F4CA
    Available endpoints:');\n    console.log('  GET  /health');\n    console.log('
    \ GET  /tools');\n    console.log('  POST /tools/execute');\n    console.log('
    \ GET  /datastores');\n    console.log('  POST /trino/execute');\n});\n//# sourceMappingURL=http-server.js.map"
