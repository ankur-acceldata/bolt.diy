  mcp-websocket-client.js: "/**\n * MCP WebSocket Client for Bolt.diy\n *\n * This
    client can be used by Bolt.diy to connect to the MCP server\n * running in Kubernetes
    via WebSocket.\n */\nimport WebSocket from 'ws';\nexport class MCPWebSocketClient
    {\n    ws = null;\n    config;\n    reconnectAttempts = 0;\n    isConnected =
    false;\n    pingTimer = null;\n    messageQueue = [];\n    requestId = 0;\n    pendingRequests
    = new Map();\n    constructor(config) {\n        this.config = {\n            reconnectInterval:
    5000,\n            maxReconnectAttempts: 10,\n            pingInterval: 30000,\n
    \           ...config\n        };\n    }\n    /**\n     * Connect to the MCP WebSocket
    server\n     */\n    async connect() {\n        return new Promise((resolve, reject)
    => {\n            try {\n                const headers = {};\n                if
    (this.config.authToken) {\n                    headers['Authorization'] = `Bearer
    ${this.config.authToken}`;\n                }\n                this.ws = new WebSocket(this.config.url,
    { headers });\n                this.ws.on('open', () => {\n                    console.log('✅
    Connected to MCP WebSocket server');\n                    this.isConnected = true;\n
    \                   this.reconnectAttempts = 0;\n                    this.startPing();\n
    \                   this.processMessageQueue();\n                    resolve();\n
    \               });\n                this.ws.on('message', (data) => {\n                    try
    {\n                        const message = JSON.parse(data.toString());\n                        this.handleMessage(message);\n
    \                   }\n                    catch (error) {\n                        console.error('Error
    parsing message:', error);\n                    }\n                });\n                this.ws.on('close',
    () => {\n                    console.log('\U0001F50C WebSocket connection closed');\n
    \                   this.isConnected = false;\n                    this.stopPing();\n
    \                   this.handleReconnect();\n                });\n                this.ws.on('error',
    (error) => {\n                    console.error('WebSocket error:', error);\n
    \                   if (!this.isConnected) {\n                        reject(error);\n
    \                   }\n                });\n                this.ws.on('pong',
    () => {\n                    // Keep-alive received\n                });\n            }\n
    \           catch (error) {\n                reject(error);\n            }\n        });\n
    \   }\n    /**\n     * Disconnect from the MCP server\n     */\n    disconnect()
    {\n        this.stopPing();\n        if (this.ws) {\n            this.ws.close();\n
    \           this.ws = null;\n        }\n        this.isConnected = false;\n    }\n
    \   /**\n     * List available tools from the MCP server\n     */\n    async listTools()
    {\n        const response = await this.sendRequest('tools/list', {});\n        return
    response.tools || [];\n    }\n    /**\n     * Execute a tool on the MCP server\n
    \    */\n    async executeTool(toolName, params) {\n        const response = await
    this.sendRequest('tools/call', {\n            name: toolName,\n            arguments:
    params\n        });\n        return response;\n    }\n    /**\n     * Execute
    a custom query via HTTP fallback\n     */\n    async executeCustomQuery(endpoint,
    params) {\n        // This can be used as a fallback to HTTP if WebSocket fails\n
    \       const baseUrl = this.config.url.replace('ws://', 'http://').replace('wss://',
    'https://');\n        const apiUrl = baseUrl.replace('/ws', '');\n        const
    response = await fetch(`${apiUrl}/api${endpoint}`, {\n            method: 'POST',\n
    \           headers: {\n                'Content-Type': 'application/json',\n
    \               ...(this.config.authToken ? { 'Authorization': `Bearer ${this.config.authToken}`
    } : {})\n            },\n            body: JSON.stringify(params)\n        });\n
    \       if (!response.ok) {\n            throw new Error(`HTTP error! status:
    ${response.status}`);\n        }\n        return await response.json();\n    }\n
    \   /**\n     * Send a JSON-RPC request\n     */\n    sendRequest(method, params)
    {\n        return new Promise((resolve, reject) => {\n            if (!this.isConnected
    || !this.ws) {\n                // Queue the message if not connected\n                this.messageQueue.push({
    resolve, reject, message: { method, params } });\n                this.handleReconnect();\n
    \               return;\n            }\n            const id = ++this.requestId;\n
    \           const request = {\n                jsonrpc: '2.0',\n                id,\n
    \               method,\n                params\n            };\n            this.pendingRequests.set(id,
    { resolve, reject });\n            try {\n                this.ws.send(JSON.stringify(request));\n
    \           }\n            catch (error) {\n                this.pendingRequests.delete(id);\n
    \               reject(error);\n            }\n        });\n    }\n    /**\n     *
    Handle incoming messages\n     */\n    handleMessage(message) {\n        // Handle
    JSON-RPC responses\n        if (message.jsonrpc === '2.0' && message.id !== undefined)
    {\n            const pending = this.pendingRequests.get(message.id);\n            if
    (pending) {\n                this.pendingRequests.delete(message.id);\n                if
    (message.error) {\n                    pending.reject(new Error(message.error.message
    || 'Unknown error'));\n                }\n                else {\n                    pending.resolve(message.result);\n
    \               }\n            }\n            return;\n        }\n        // Handle
    other message types\n        switch (message.type) {\n            case 'connection':\n
    \               console.log(`Connected with session ID: ${message.sessionId}`);\n
    \               break;\n            case 'pong':\n                // Pong received\n
    \               break;\n            case 'error':\n                console.error('Server
    error:', message.error);\n                break;\n            default:\n                console.log('Received
    message:', message);\n        }\n    }\n    /**\n     * Start ping timer\n     */\n
    \   startPing() {\n        if (this.config.pingInterval) {\n            this.pingTimer
    = setInterval(() => {\n                if (this.ws && this.isConnected) {\n                    this.ws.send(JSON.stringify({
    type: 'ping' }));\n                }\n            }, this.config.pingInterval);\n
    \       }\n    }\n    /**\n     * Stop ping timer\n     */\n    stopPing() {\n
    \       if (this.pingTimer) {\n            clearInterval(this.pingTimer);\n            this.pingTimer
    = null;\n        }\n    }\n    /**\n     * Handle reconnection\n     */\n    handleReconnect()
    {\n        if (this.reconnectAttempts >= (this.config.maxReconnectAttempts ||
    10)) {\n            console.error('Max reconnection attempts reached');\n            return;\n
    \       }\n        this.reconnectAttempts++;\n        console.log(`Attempting
    to reconnect (${this.reconnectAttempts}/${this.config.maxReconnectAttempts})...`);\n
    \       setTimeout(() => {\n            this.connect().catch(error => {\n                console.error('Reconnection
    failed:', error);\n            });\n        }, this.config.reconnectInterval);\n
    \   }\n    /**\n     * Process queued messages after reconnection\n     */\n    processMessageQueue()
    {\n        while (this.messageQueue.length > 0) {\n            const { resolve,
    reject, message } = this.messageQueue.shift();\n            this.sendRequest(message.method,
    message.params)\n                .then((result) => resolve(result))\n                .catch((error)
    => reject(error));\n        }\n    }\n    /**\n     * Check if client is connected\n
    \    */\n    isClientConnected() {\n        return this.isConnected;\n    }\n
    \   /**\n     * Get WebSocket ready state\n     */\n    getReadyState() {\n        return
    this.ws ? this.ws.readyState : WebSocket.CLOSED;\n    }\n}\n// Export for use
    in Bolt.diy\nexport default MCPWebSocketClient;\n//# sourceMappingURL=mcp-websocket-client.js.map"
