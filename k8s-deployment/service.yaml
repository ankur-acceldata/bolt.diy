apiVersion: v1
kind: Service
metadata:
  name: xdp-mcp-server-service
  namespace: mcp-server
  labels:
    app: xdp-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: xdp-mcp-server
---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xdp-mcp-server-ingress
  namespace: mcp-server
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - xdp-mcp.xdp-dev.acceldata.tech
    secretName: xdp-mcp-server-tls
  rules:
  - host: xdp-mcp.xdp-dev.acceldata.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: xdp-mcp-server-service
            port:
              number: 3000