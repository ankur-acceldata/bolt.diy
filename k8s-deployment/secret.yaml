apiVersion: v1
kind: Secret
metadata:
  name: xdp-mcp-server-secrets
  namespace: mcp-server
type: Opaque
data:
  # Base64 encoded values - replace with actual credentials
  # To encode: echo -n "your-access-key" | base64
  XDP_ACCESS_KEY: "ABCD"  # REPLACE_WITH_ACTUAL_ACCESS_KEY
  XDP_SECRET_KEY: "ABCDEF"  # REPLACE_WITH_ACTUAL_SECRET_KEY
---
# ConfigMap for additional configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: xdp-mcp-server-config
  namespace: mcp-server
data:
  XDP_BASE_URL: "https://demo.xdp-dev.acceldata.tech/xdp-cp-service/api"
  BOLT_API_URL: "http://bolt-diy-service:5173"
  NODE_ENV: "production"
