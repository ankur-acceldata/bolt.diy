apiVersion: v1
kind: Service
metadata:
  name: xdp-mcp-server-service
  namespace: mcp-server
  labels:
    app: xdp-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: xdp-mcp-server
---
# LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: xdp-mcp-server-lb
  namespace: mcp-server
  labels:
    app: xdp-mcp-server
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: xdp-mcp-server